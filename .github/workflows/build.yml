name: build
on:
  push:
  workflow_dispatch:
jobs:
  sim:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Ikon 1024 tanpa alpha
        run: |
          sips -z 1024 1024 icon-src.png --out /tmp/i.png
          sips -s format jpeg /tmp/i.png --out /tmp/i.jpg
          sips -s format png /tmp/i.jpg --out Keepo/Assets.xcassets/AppIcon.appiconset/icon-1024.png
      - run: brew install xcodegen && xcodegen generate
      - name: Build simulator
        run: |
          xcodebuild -project Keepo.xcodeproj -scheme Keepo -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -5
      - name: Screenshot App Store (iPhone 6,9")
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for k,v in d.items() if 'iOS' in k for x in v if 'Pro Max' in x['name']];print(c[-1]['udid'])")
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Keepo.app
          START=$(date '+%Y-%m-%d %H:%M:%S')
          xcrun simctl launch "$UDID" com.rzklabs.keepo -shots
          for i in $(seq 1 60); do
            xcrun simctl spawn "$UDID" log show --start "$START" --style compact --predicate 'eventMessage CONTAINS "KEEPO didFinish"' | grep -q didFinish && break; sleep 3; done
          mkdir -p shots
          sleep 10; xcrun simctl io "$UDID" screenshot shots/1-home.png
          sleep 15; xcrun simctl io "$UDID" screenshot shots/2-baca.png
          sleep 20; xcrun simctl io "$UDID" screenshot shots/3-arti.png
          xcrun simctl spawn "$UDID" log show --start "$START" --style compact --predicate 'eventMessage CONTAINS "KEEPO"' > shots/log.txt || true
          cat shots/log.txt; sips -g pixelWidth -g pixelHeight shots/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: shots/

  # Upload ke TestFlight (manual): tanda tangan manual dengan sertifikat distribusi + profil App Store dari Secrets
  testflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Ikon 1024 tanpa alpha
        run: |
          sips -z 1024 1024 icon-src.png --out /tmp/i.png
          sips -s format jpeg /tmp/i.png --out /tmp/i.jpg
          sips -s format png /tmp/i.jpg --out Keepo/Assets.xcassets/AppIcon.appiconset/icon-1024.png
      - run: brew install xcodegen && xcodegen generate
      - name: Sertifikat + profil
        env:
          P12: ${{ secrets.DIST_P12_BASE64 }}
          P12PW: ${{ secrets.DIST_P12_PASSWORD }}
          PROF: ${{ secrets.PROFILE_BASE64 }}
        run: |
          set -eo pipefail
          KC=$RUNNER_TEMP/b.keychain-db; KP=$(uuidgen)
          security create-keychain -p "$KP" "$KC"; security set-keychain-settings -lut 21600 "$KC"; security unlock-keychain -p "$KP" "$KC"
          echo "$P12" | base64 --decode > $RUNNER_TEMP/d.p12
          security import $RUNNER_TEMP/d.p12 -P "$P12PW" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC" >/dev/null
          security list-keychain -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROF" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/keepo.mobileprovision
      - name: Archive + upload
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -eo pipefail
          echo "$P8" | base64 --decode > $RUNNER_TEMP/key.p8
          xcodebuild -project Keepo.xcodeproj -scheme Keepo -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Keepo.xcarchive DEVELOPMENT_TEAM=$TEAM CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="Keepo AppStore" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} archive | tail -15
          cat > $RUNNER_TEMP/export.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>$TEAM</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>provisioningProfiles</key><dict><key>com.rzklabs.keepo</key><string>Keepo AppStore</string></dict>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath build/Keepo.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath build/export -authenticationKeyPath $RUNNER_TEMP/key.p8 -authenticationKeyID $KID -authenticationKeyIssuerID $ISS | tail -25
